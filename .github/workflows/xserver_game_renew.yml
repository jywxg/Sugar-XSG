name: XServer-Game-Renew

on:
  workflow_dispatch:
  repository_dispatch:
    types: [renew-trigger] # 接收来自 Cloudflare Worker 的唤醒信号

# 🔑 赋予 GitHub Actions 提交并推送代码的写入权限
permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 拉取仓库
        uses: actions/checkout@v4

      - name: 🐍 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📦 安装依赖
        run: pip install requests --quiet

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash setup_proxy.sh

      - name: 🔧 执行续期
        env:
          XSERVER_GAME_ACCOUNT: ${{ secrets.XSERVER_GAME_ACCOUNT }}
          NODE_LINK: ${{ secrets.NODE_LINK }}
          IS_PROXY: ${{ secrets.IS_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_SCRIPT_NAME: ${{ secrets.CF_SCRIPT_NAME }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 xserver_game_renew.py

      - name: ⏱️ 更新运行记录 (防止 Actions 被封停)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "最后运行时间: $(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 自动更新运行记录，保活 Actions [skip ci]"
            git pull origin main --rebase
            git push origin HEAD:main
          fi
