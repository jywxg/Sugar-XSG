name: XServer-Game-Renew

on:
  workflow_dispatch:
  repository_dispatch:
    types: [renew-trigger]

# 🔑 赋予 GitHub Actions 提交代码及清理 Workflow 历史记录的写入权限
permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 拉取仓库
        uses: actions/checkout@v4

      - name: 🐍 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📦 安装依赖
        run: pip install "requests[socks]" --quiet

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash setup_proxy.sh

      - name: 🔧 执行续期
        env:
          XSERVER_GAME_ACCOUNT: ${{ secrets.XSERVER_GAME_ACCOUNT }}
          NODE_LINK: ${{ secrets.NODE_LINK }}
          IS_PROXY: ${{ env.USE_PROXY }}
          PROXY_STATUS: ${{ env.PROXY_STATUS }}
          TG_BOT: ${{ secrets.TG_BOT }}
          # 👇 替换为了 cron-job.org 变量
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_ID: ${{ secrets.CRONJOB_ID }}
        run: python3 xserver_game_renew.py

      - name: ⏱️ 更新运行记录
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "最后运行时间: $(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 自动更新运行记录，保活 Actions"
            git pull origin main --rebase
            git push origin HEAD:main
          fi

      - name: 🧹 清理历史运行记录
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取最多 100 条工作流记录 ID
          runs=$(gh run list -L 100 --json databaseId --jq '.[].databaseId')
          
          # 遍历删除，遇到当前正在运行的 ID ($GITHUB_RUN_ID) 则跳过
          for run in $runs; do
            if [ "$run" != "$GITHUB_RUN_ID" ]; then
              echo "🗑️ 正在删除多余的历史记录 ID: $run"
              gh run delete "$run" || true
            fi
          done
